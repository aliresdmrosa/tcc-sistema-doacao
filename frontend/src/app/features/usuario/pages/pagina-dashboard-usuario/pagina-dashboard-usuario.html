<div class="dashboard-container">
  <section class="boas-vindas">
    <h1>Bem-vindo!</h1>
  </section>

  <section class="cards-resumo">
    <mat-card class="card-resumo">
      <mat-card-content>
        <h3>Doações</h3>
        <p>{{ totalDoacoes }}</p>
      </mat-card-content>
    </mat-card>

    <mat-card class="card-resumo">
      <mat-card-content>
        <h3>Alunos Beneficiados</h3>
        <p>{{ totalAlunosBeneficiados }}</p>
      </mat-card-content>
    </mat-card>
  </section>

  <section class="charts-grid">
    <mat-card class="chart-card">
      <mat-card-content>
        <apx-chart
          [series]="donutChartOptions.series"
          [chart]="donutChartOptions.chart"
          [labels]="donutChartOptions.labels"
          [title]="donutChartOptions.title">
        </apx-chart>
      </mat-card-content>
    </mat-card>

    <mat-card class="chart-card">
      <mat-card-content>
        <apx-chart
          #barChart
          [series]="barChartOptions.series"
          [chart]="barChartOptions.chart"
          [xaxis]="barChartOptions.xaxis"
          [title]="barChartOptions.title"
          [dataLabels]="barChartOptions.dataLabels"
          [plotOptions]="barChartOptions.plotOptions">
        </apx-chart>
      </mat-card-content>
    </mat-card>
  </section>

  <section class="informacoes-dashboard">
    <mat-card class="card-informacao local-entrega">
      <mat-card-content>
        <mat-icon aria-hidden="true">location_on</mat-icon>
        <p>
          <strong>Local para entrega e retirada dos equipamentos:</strong>
          <br>
          Setor de Educação Profissional e Tecnológica UFPR - R. Dr. Alcides Vieira Arcoverde, 1225 - Jardim das Américas, Curitiba - PR, 81520-260
        </p>
      </mat-card-content>
    </mat-card>
  </section>
</div>
