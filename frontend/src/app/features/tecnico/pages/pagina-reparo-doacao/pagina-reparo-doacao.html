<div class="pagina-reparo-doacao">

  <div class="botao-voltar" (click)="voltar()">
    <mat-icon>arrow_back</mat-icon>
  </div>

  <section class="identificacao-doacao">
    <h2>Identificação da doação</h2>
    <span class="badge-status" [class.status-reparo]="statusDoacao === 'REPARO'">
      {{ statusDoacao.toLowerCase() }}
    </span>
    <p>ID: {{ idDoacao }}</p>
    <p>Item: Notebook Dell</p>
  </section>

  <mat-card class="card-listagem mat-elevation-z8">
    <mat-card-content>

      <div class="tabela-container">
        <table mat-table [dataSource]="dataSource" class="tabela-reparos">

          <ng-container matColumnDef="data">
            <th mat-header-cell *matHeaderCellDef>Data</th>
            <td mat-cell *matCellDef="let reparo">{{ reparo.data }}</td>
          </ng-container>

          <ng-container matColumnDef="tecnico">
            <th mat-header-cell *matHeaderCellDef>Técnico</th>
            <td mat-cell *matCellDef="let reparo">{{ reparo.tecnico }}</td>
          </ng-container>

          <ng-container matColumnDef="descricao">
            <th mat-header-cell *matHeaderCellDef>Descrição</th>
            <td mat-cell *matCellDef="let reparo">{{ reparo.descricao }}</td>
          </ng-container>

          <ng-container matColumnDef="acoes">
            <th mat-header-cell *matHeaderCellDef>Ações</th>
            <td mat-cell *matCellDef="let reparo" class="celula-acoes">
              <button
                mat-icon-button
                type="button"
                aria-label="Editar descrição"
                (click)="editarDescricao(reparo)">
                <mat-icon>edit</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

        <mat-paginator
          [pageSize]="5"
          [pageSizeOptions]="[5, 10, 20]"
          showFirstLastButtons>
        </mat-paginator>
      </div>

    </mat-card-content>
  </mat-card>

  <section class="novo-reparo-titulo">
    <h2>Novo Reparo</h2>
  </section>

  <section class="form-reparo">
    <mat-form-field class="campo-descricao">
      <mat-label>Descrição</mat-label>
      <textarea matInput rows="5" [(ngModel)]="descricao"></textarea>
    </mat-form-field>

    <div class="acoes-formulario">
      <button mat-raised-button color="primary" type="button" class="botao-salvar" (click)="salvarReparo()">
        <mat-icon>check</mat-icon>
        Salvar Reparo
      </button>

    </div>

  </section>

</div>
