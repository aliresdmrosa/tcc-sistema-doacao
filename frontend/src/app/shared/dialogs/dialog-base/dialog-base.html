<div class="modal-base">

  <button
    *ngIf="!data.carregando"
    class="botao-fechar"
    mat-icon-button
    type="button"
    aria-label="Fechar modal"
    (click)="cancelar()">

    <mat-icon>close</mat-icon>

  </button>

  <div class="conteudo-modal">

    <mat-progress-spinner
      *ngIf="data.carregando"
      mode="indeterminate"
      diameter="44"
      class="spinner-modal">
    </mat-progress-spinner>

    <div class="textos">

      <h2>
        {{ data.titulo }}
      </h2>

      <p>
        {{ data.mensagem }}
      </p>

    </div>

    <div class="acoes-modal" *ngIf="!data.carregando">

      <button
        *ngIf="data.mostrarCancelar"
        mat-stroked-button
        type="button"
        (click)="cancelar()">

        {{ data.textoCancelar || 'Cancelar' }}

      </button>

      <button
        *ngIf="data.mostrarConfirmar !== false"
        mat-raised-button
        color="primary"
        type="button"
        (click)="confirmar()">

        {{ data.textoConfirmar || 'OK' }}

      </button>

    </div>

  </div>

</div>
